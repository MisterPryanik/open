<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Анжелике — 25!</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1a2844 0%, #0f1a2e 50%, #060a14 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px 12px;
    position: relative;
  }
  #stars { position: absolute; inset: 0; overflow: hidden; }
  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #ffd9a0;
    border-radius: 50%;
    animation: twinkle var(--d) infinite ease-in-out;
    animation-delay: var(--delay);
    opacity: .6;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .2; transform: scale(.8); }
    50% { opacity: 1; transform: scale(1.4); }
  }
  .card {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 24px 16px 90px;
    max-width: 640px;
    width: 100%;
    max-height: 95vh;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .card::-webkit-scrollbar { display: none; }
  .envelope {
    width: 190px; height: 120px;
    margin: 20px auto 0;
    position: relative;
    cursor: pointer;
    border-radius: 12px;
    background: linear-gradient(135deg, #ff9a3c, #ff5e3a);
    box-shadow: 0 20px 40px rgba(255, 120, 60, .45);
    animation: float 3s ease-in-out infinite;
    transition: transform .25s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .envelope:hover { transform: scale(1.06); }
  .envelope:active { transform: scale(.98); }
  .envelope .trainIcon {
    font-size: 52px;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.25));
  }
  .flap {
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-left: 95px solid transparent;
    border-right: 95px solid transparent;
    border-top: 70px solid #ffc06b;
    border-radius: 12px 12px 0 0;
    transform-origin: top;
    transition: transform .6s ease;
    z-index: 3;
  }
  .envelope.open .flap { transform: rotateX(180deg); }
  .hint {
    margin-top: 22px;
    font-size: 17px;
    letter-spacing: .3px;
    opacity: .8;
    animation: pulse 2s infinite;
    color: #ffe8c8;
  }
  @keyframes pulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .content { display: none; animation: fadeIn .9s ease both; }
  .content.show { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  h1 {
    font-size: clamp(26px, 7vw, 42px);
    line-height: 1.15;
    margin: 0 0 16px;
    background: linear-gradient(90deg, #fff, #ffd9a0, #ffb37a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    min-height: 1.2em;
  }
  .message {
    font-size: clamp(15px, 4vw, 18px);
    line-height: 1.65;
    color: #f3e6d0;
    min-height: 5em;
    margin: 0 auto 18px;
    max-width: 540px;
    white-space: pre-line;
  }

  /* === Мини-игра === */
  .game {
    margin-top: 14px;
    padding: 20px 14px;
    border-radius: 20px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,180,90,.2);
    display: none;
    animation: fadeIn .8s ease both;
  }
  .game.show { display: block; }
  .gameTitle {
    font-size: clamp(15px, 4vw, 18px);
    color: #ffe8c8;
    margin: 0 0 6px;
    font-weight: 600;
  }
  .gameSub {
    font-size: 14px;
    color: #e0c79a;
    margin: 0 0 12px;
    opacity: .9;
  }
  .gameField {
    position: relative;
    width: 100%;
    height: 220px;
    border-radius: 16px;
    background: radial-gradient(circle at 50% 50%, rgba(255,154,60,.1), rgba(0,0,0,.3));
    border: 1px dashed rgba(255,180,90,.3);
    overflow: hidden;
    touch-action: manipulation;
  }
  .catchWagon {
    position: absolute;
    font-size: 30px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    animation: drift var(--dur) linear infinite;
    animation-delay: var(--delay);
    filter: drop-shadow(0 0 6px rgba(255,180,90,.6));
    transition: transform .15s;
  }
  .catchWagon:hover { transform: scale(1.15); }
  .catchWagon.popped {
    animation: pop .4s ease forwards;
    pointer-events: none;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    25%  { transform: translate(var(--x1), var(--y1)) scale(1.05); }
    50%  { transform: translate(var(--x2), var(--y2)) scale(.95); }
    75%  { transform: translate(var(--x3), var(--y3)) scale(1.05); }
    100% { transform: translate(0, 0) scale(1); }
  }
  @keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  .trainLine {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1px;
    margin: 14px 0 4px;
    min-height: 40px;
    font-size: 28px;
    filter: drop-shadow(0 4px 8px rgba(255,154,60,.4));
  }
  .trainLine .loco { font-size: 34px; }
  .wagonIn {
    display: inline-block;
    animation: wagonIn .45s ease both;
  }
  @keyframes wagonIn {
    from { transform: translateX(30px) scale(.4); opacity: 0; }
    to   { transform: translateX(0) scale(1); opacity: 1; }
  }
  .score {
    margin-top: 8px;
    font-size: 16px;
    color: #ffd9a0;
    font-weight: 600;
    letter-spacing: .3px;
  }
  .score strong { color: #fff; font-size: 18px; }

  /* === Финал === */
  .final { display: none; animation: fadeIn .9s ease both; }
  .final.show { display: block; }
  .finalTitle {
    font-size: clamp(20px, 5.5vw, 26px);
    margin: 20px 0 12px;
    font-weight: 700;
    background: linear-gradient(90deg, #ffd9a0, #ff8c42);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    min-height: 1.3em;
  }
  .finalText {
    font-size: clamp(16px, 4.5vw, 19px);
    line-height: 1.6;
    color: #fff0dc;
    min-height: 5.2em;
    margin: 0 auto 18px;
    max-width: 540px;
  }
  .btn {
    padding: 13px 26px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff9a3c, #ff5e3a);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 12px 24px rgba(255,120,60,.4);
    transition: transform .2s, box-shadow .2s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 30px rgba(255,120,60,.55); }
  .btn:active { transform: scale(.96); }

  /* === Едущий поезд === */
  .trainPass {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 70px;
    pointer-events: none;
    overflow: hidden;
    z-index: 100;
    display: none;
  }
  .trainPass.show { display: block; }
  .trainPass .rails {
    position: absolute;
    bottom: 14px;
    left: 0;
    width: 100%;
    height: 4px;
    background: repeating-linear-gradient(
      90deg,
      #ffb37a 0 14px,
      transparent 14px 22px
    );
    opacity: .35;
  }
  .trainPass .train {
    position: absolute;
    bottom: 18px;
    left: 0;
    display: flex;
    align-items: flex-end;
    font-size: 42px;
    line-height: 1;
    white-space: nowrap;
    filter: drop-shadow(0 6px 10px rgba(255,120,60,.5));
    animation: trainMove 12s linear infinite;
  }
  .trainPass .train .car {
    margin-left: -6px;
  }
  .trainPass .train .loco {
    font-size: 46px;
    margin-right: -2px;
  }
  @keyframes trainMove {
    0%   { transform: translateX(-100vw); }
    70%  { transform: translateX(100vw); }
    100% { transform: translateX(100vw); }
  }

  .heart {
    position: fixed;
    bottom: -50px;
    font-size: 24px;
    pointer-events: none;
    z-index: 999;
    animation: fly var(--t) linear forwards;
  }
  @keyframes fly {
    0% { transform: translateY(0) rotate(0deg) scale(.6); opacity: 1; }
    100% { transform: translateY(-115vh) rotate(360deg) scale(1.4); opacity: 0; }
  }
</style>
</head>
<body>
<div id="stars"></div>

<!-- Едущий поезд -->
<div class="trainPass" id="trainPass">
  <div class="rails"></div>
  <div class="train">
    <span class="loco">🚂</span>
    <span class="car">🚃</span>
    <span class="car">🚃</span>
    <span class="car">🚃</span>
    <span class="car">🚃</span>
  </div>
</div>

<div class="card">
  <div class="envelope" id="envelope">
    <div class="flap"></div>
    <div class="trainIcon">🚂</div>
  </div>
  <p class="hint" id="hint">Нажми на конверт</p>

  <div class="content" id="content">
    <h1 id="title"></h1>
    <p class="message" id="message"></p>

    <!-- Мини-игра -->
    <div class="game" id="game">
      <p class="gameTitle">Поймай 5 вагонов — собери свой состав 🚃</p>
      <p class="gameSub">Они разбегаются — не зевай!</p>
      <div class="gameField" id="gameField"></div>
      <div class="trainLine" id="trainLine">
        <span class="loco">🚂</span>
      </div>
      <p class="score">Поймано: <strong id="score">0</strong> / 5</p>
    </div>

    <!-- Финал -->
    <div class="final" id="final">
      <p class="finalTitle" id="finalTitle"></p>
      <p class="finalText" id="finalText"></p>
      <button class="btn" id="surpriseBtn">Нажми ещё ✨</button>
    </div>
  </div>
</div>

<script>
  // Звёзды
  const stars = document.getElementById('stars');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('span');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.setProperty('--d', (2 + Math.random() * 3) + 's');
    s.style.setProperty('--delay', (Math.random() * 3) + 's');
    stars.appendChild(s);
  }

  const envelope    = document.getElementById('envelope');
  const hint        = document.getElementById('hint');
  const content     = document.getElementById('content');
  const titleEl     = document.getElementById('title');
  const messageEl   = document.getElementById('message');
  const game        = document.getElementById('game');
  const gameField   = document.getElementById('gameField');
  const trainLine   = document.getElementById('trainLine');
  const scoreEl     = document.getElementById('score');
  const final       = document.getElementById('final');
  const finalTitle  = document.getElementById('finalTitle');
  const finalText   = document.getElementById('finalText');
  const surpriseBtn = document.getElementById('surpriseBtn');
  const trainPass   = document.getElementById('trainPass');

  // ==== ЗАМЕНИ НА СВОЁ ====
  const NAME = 'Анжелика';
  const TITLE = `С 25-летием, ${NAME}! 🚂`;
  const MESSAGE = 'Четверть века — а ты всё ещё молодой экспресс на полном ходу. У тебя и стаж, и стиль, и юмор — полный комплект. Пусть рельсы будут ровными, маршрут длинным, а мы, твои пассажиры, — вечными. С днём рождения! 🎉';
  // ========================

  const FINAL_TITLES = [
    'Состав собран! 🚂',
    'Полный вперёд!',
    'Станция «25 лет» 🎂',
    'Гудок! Поехали 🚞',
    'Билет в один конец — в счастье',
    'Поезд тронулся 🎉'
  ];

  const FINAL_PHRASES = [
    'Четверть века! По такому поводу даже поезда делают остановку.',
    '25 — это не возраст, это стаж. Официально подтверждаем! 🚂',
    'Ты молода, красива и уже помощник машиниста. Дальше — только машинист, а потом и министр транспорта 😎',
    'Пусть всё едет по расписанию: радости — без задержек, проблемы — отменяются.',
    'Спасибо, что ты есть. Дружба с тобой — как билет в первый класс: никуда не спешишь и наслаждаешься поездкой.',
    'С 25-летием! Следующая станция — счастье. И все последующие тоже 🌟',
    'Пусть этот год будет как хороший рейс: без опозданий, с отличными пассажирами и приятными видами из окна 🚞',
    'Желаю тебе вагонов удачи, состава здоровья и локомотив настроения, который никогда не сойдёт с рельсов ❤️'
  ];

  let phraseIndex = 0;
  let wagonsCaught = 0;

  // === typeWriter: не рвёт эмодзи и отменяет старую печать ===
  let typeToken = 0;
  const typeTokens = new WeakMap();

  function typeWriter(el, text, speed, done) {
    const myToken = ++typeToken;
    typeTokens.set(el, myToken);

    const chars = Array.from(text);
    el.textContent = '';
    let i = 0;

    (function tick() {
      if (typeTokens.get(el) !== myToken) return;

      if (i < chars.length) {
        el.textContent += chars[i++];
        setTimeout(tick, speed);
      } else if (done) {
        done();
      }
    })();
  }

  function burstHearts(count = 30) {
    const emojis = ['✨', '💫', '🎉', '🌟', '🚂', '🎂', '❤️'];
    for (let i = 0; i < count; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = (18 + Math.random() * 22) + 'px';
      h.style.setProperty('--t', (2.2 + Math.random() * 2.2) + 's');
      h.style.animationDelay = (Math.random() * 0.5) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 5000);
    }
  }

  // === Мини-игра ===
  function startGame() {
    game.classList.add('show');
    wagonsCaught = 0;
    scoreEl.textContent = '0';

    // очищаем всё, кроме локомотива
    trainLine.querySelectorAll('.wagonIn').forEach(w => w.remove());

    const TOTAL = 5;

    for (let i = 0; i < TOTAL; i++) {
      const h = document.createElement('div');
      h.className = 'catchWagon';
      h.textContent = '🚃';

      h.style.left = (10 + Math.random() * 70) + '%';
      h.style.top  = (10 + Math.random() * 65) + '%';

      const dx = 15 + Math.random() * 20;
      const dy = 10 + Math.random() * 15;
      h.style.setProperty('--x1', (dx) + 'px');
      h.style.setProperty('--y1', (-dy) + 'px');
      h.style.setProperty('--x2', (-dx * 0.8) + 'px');
      h.style.setProperty('--y2', (dy * 0.6) + 'px');
      h.style.setProperty('--x3', (dx * 0.6) + 'px');
      h.style.setProperty('--y3', (-dy * 0.9) + 'px');

      const dur = (2.8 + Math.random() * 2).toFixed(2);
      h.style.setProperty('--dur', dur + 's');
      h.style.setProperty('--delay', (Math.random() * 1.5).toFixed(2) + 's');

      h.addEventListener('click', () => {
        if (h.classList.contains('popped')) return;
        h.classList.add('popped');
        wagonsCaught++;
        scoreEl.textContent = wagonsCaught;
        burstHearts(6);

        // прицепляем вагон к составу
        const w = document.createElement('span');
        w.className = 'wagonIn';
        w.textContent = '🚃';
        trainLine.appendChild(w);

        if (wagonsCaught >= TOTAL) {
          setTimeout(() => {
            game.style.display = 'none';
            final.classList.add('show');
            trainPass.classList.add('show');
            phraseIndex = 0;
            typeWriter(finalTitle, FINAL_TITLES[0], 40, () => {
              typeWriter(finalText, FINAL_PHRASES[0], 28, () => burstHearts(25));
            });
            burstHearts(25);
          }, 700);
        }
      });

      gameField.appendChild(h);
    }
  }

  // === Открытие конверта ===
  envelope.addEventListener('click', () => {
    envelope.classList.add('open');
    setTimeout(() => {
      envelope.style.display = 'none';
      hint.style.display = 'none';
      content.classList.add('show');

      typeWriter(titleEl, TITLE, 60, () => {
        typeWriter(messageEl, MESSAGE, 22, () => {
          setTimeout(startGame, 400);
        });
      });
      burstHearts(20);
    }, 650);
  });

  // === Кнопка «Нажми ещё» ===
  surpriseBtn.addEventListener('click', () => {
    phraseIndex = (phraseIndex + 1) % FINAL_PHRASES.length;
    const titleIdx = phraseIndex % FINAL_TITLES.length;
    typeWriter(finalTitle, FINAL_TITLES[titleIdx], 40, () => {
      typeWriter(finalText, FINAL_PHRASES[phraseIndex], 28);
    });
    burstHearts(30);
  });
</script>
</body>
</html>
